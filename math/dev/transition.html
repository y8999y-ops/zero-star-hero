<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戰鬥轉場一覽</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<!-- 開發用：按按鈕播放五個屬性的戰鬥轉場（一般／王戰）。 -->
<main id="app"><div class="screen" id="menu" style="gap:8px"></div></main>
<script>
  // ?attr=fire&t=0.5（&boss）：用假的時鐘播到第 t 秒就停住，方便截圖
  const q = new URLSearchParams(location.search);
  if (q.has("t")) {
    let fake = 1000; const stopAt = 1000 + Number(q.get("t")) * 1000;
    performance.now = () => fake;
    window.requestAnimationFrame = (cb) => { if (fake < stopAt) setTimeout(() => { fake = Math.min(stopAt, fake + 1000 / 60); cb(fake); }, 0); return 0; };
  }
</script>
<script type="module">
  import { battleIn, battleOut } from "../src/transition.js";
  import { ATTRS } from "../src/data.js";
  const menu = document.querySelector("#menu");
  for (const a of Object.keys(ATTRS)) for (const boss of [false, true]) {
    const b = document.createElement("button");
    b.className = "btn"; b.textContent = `${ATTRS[a].name}${boss ? "（王戰）" : ""}`;
    b.onclick = () => battleIn(a, () => new Promise((r) => setTimeout(r, 50)), { boss }).then(() => setTimeout(() => battleOut(a, () => {}), 600));
    menu.append(b);
  }
  if (q.has("t")) battleIn(q.get("attr") ?? "fire", () => {}, { boss: q.has("boss") });
</script>
</body>
</html>
