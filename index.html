<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>轉生成星星碎片的我，靠吸收魔物變成最強</title>
<style>
  /* 外框頁：遊戲放在 iframe 裡。換場景只重新載入 iframe，全螢幕跟橫向鎖定留在這一層，不會被跳出來 */
  html, body { margin: 0; height: 100%; background: #0d0b14; overflow: hidden; overscroll-behavior: none; }
  iframe { position: fixed; border: 0; display: block;
    top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
    width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right)); height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  /* 使用者 2026-11-06：切到後台再切回來，瀏覽器會退出全螢幕（而且一定要點一下才能再進去）→ 蓋一層「點一下回到全螢幕」 */
  #refull { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(13, 11, 20, .82); color: #ffe27a; font: 900 20px/1.4 system-ui, sans-serif; letter-spacing: 3px; text-align: center; -webkit-user-select: none; user-select: none; }
  #refull.on { display: flex; }
  #refull .tap { padding: 14px 28px; border: 3px solid #ffd84a; border-radius: 8px; background: #2a1c08; box-shadow: 0 0 18px rgba(255, 216, 74, .6); animation: rf 1.2s ease-in-out infinite; }
  #refull .no { font-size: 13px; color: #a89cc0; letter-spacing: 1px; padding: 8px 14px; }
  @keyframes rf { 50% { transform: scale(1.05); box-shadow: 0 0 28px rgba(255, 216, 74, .9); } }
  /* 使用者 2026-11-06「手機進網頁時自動變橫向」：瀏覽器不讓網頁一打開就自己轉——要點一下（進全螢幕時順便鎖橫向）。
     直的拿著的時候先蓋一層「轉成橫向」的提示，點一下就進全螢幕＋鎖橫向 */
  #rotate { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #0d0b14; color: #ffe27a; font: 900 18px/1.5 system-ui, sans-serif; letter-spacing: 2px; text-align: center; -webkit-user-select: none; user-select: none; }
  #rotate small { color: #a89cc0; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
  #rotate .phone { width: 46px; height: 78px; border: 4px solid #ffd84a; border-radius: 9px; position: relative; animation: rot 2.2s ease-in-out infinite; box-shadow: 0 0 16px rgba(255, 216, 74, .5); }
  #rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 10px; height: 4px; margin-left: -5px; border-radius: 2px; background: #ffd84a; }
  @keyframes rot { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="rotate"><div class="phone"></div><div>把手機轉成橫的來玩</div><small>點一下畫面，自動切成橫向全螢幕</small></div>
<div id="refull"><div class="tap">點一下回到全螢幕</div><div class="no">不用了</div></div>
<iframe id="game" allow="fullscreen; autoplay" title="轉生成星星碎片的我，靠吸收魔物變成最強"></iframe>
<script>
  // 網址上的開發用參數（?stage=1-4）照樣傳給遊戲
  const f = document.getElementById("game");
  f.src = "game/" + location.search;
  f.addEventListener("load", () => f.focus());
  addEventListener("pointerdown", () => f.focus());
  // 遊戲請外框頁開全螢幕（全螢幕由這一頁持有，換場景重新載入 iframe 時不會被退出）
  const goFull = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.("landscape")).catch(() => {}); };
  addEventListener("message", (e) => {
    if (e.origin !== location.origin || e.data?.type !== "zero-hero-fullscreen") return;
    goFull();
  });
  // 切到後台再回來：原本是全螢幕、現在不是了 → 請玩家點一下（瀏覽器規定要有點擊才能進全螢幕）
  let wantFull = false;
  const refull = document.getElementById("refull");
  const check = () => refull.classList.toggle("on", wantFull && !document.fullscreenElement && document.visibilityState === "visible");
  document.addEventListener("fullscreenchange", () => { if (document.fullscreenElement) wantFull = true; setTimeout(check, 300); });
  document.addEventListener("visibilitychange", () => setTimeout(check, 300));
  // 手機第一次點螢幕（任何地方）就進全螢幕、鎖橫向；直的拿著時點「轉成橫向」那層也一樣
  const touchy = matchMedia("(pointer: coarse)").matches;
  // 使用者 2026-11-06「點一下回全螢幕會失效」：手指按下（pointerdown）瀏覽器不算「使用者點了」，要放開（pointerup）才可以開全螢幕
  if (touchy) addEventListener("pointerup", function first() { removeEventListener("pointerup", first, true); goFull(); }, true);
  document.getElementById("rotate").addEventListener("pointerup", (e) => { e.preventDefault(); goFull(); });
  refull.addEventListener("pointerdown", (e) => e.preventDefault());
  refull.addEventListener("pointerup", (e) => { if (e.target.closest(".no")) return; e.preventDefault(); refull.classList.remove("on"); goFull(); f.focus(); });   // 整層都可以點（不用剛好點到按鈕）
  refull.querySelector(".no").addEventListener("pointerup", (e) => { e.preventDefault(); wantFull = false; refull.classList.remove("on"); f.focus(); });
</script>
</body>
</html>
